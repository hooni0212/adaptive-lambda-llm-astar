name: Research checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  correctness:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-research.txt
      - name: Install geometry verification dependency
        run: python -m pip install shapely==2.1.2
      - name: Run correctness tests
        run: python -m unittest discover -s tests -v
      - name: Run a small independent benchmark
        run: >-
          python -m benchmarks.run --split validation --max-maps 1
          --scenarios clean corrupt100 none
          --config benchmarks/selected_config.json
          --methods astar fixed_1_controlled adaptive
          --output /tmp/adaptive-lambda-smoke
